name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Clockwork.Umbraco.ImageFrame.Client/package-lock.json

      - name: Build back-office client
        working-directory: src/Clockwork.Umbraco.ImageFrame.Client
        run: |
          npm ci
          npm run build

      - name: Test
        run: dotnet test tests/Clockwork.Umbraco.ImageFrame.Tests -c Release

      - name: Pack
        run: |
          VERSION=1.0.0-ci.${{ github.run_number }}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; fi
          dotnet pack src/Clockwork.Umbraco.ImageFrame -c Release -o artifacts -p:Version=$VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

      - name: Push to NuGet.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
